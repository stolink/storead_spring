# Production Profile - Uses environment variables from GitHub Secrets
spring:
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_URL}:${POSTGRESQL_PORT:5432}/stolink
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Production JPA settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    base-path: ${APP_STORAGE_BASE_PATH:/app/storage/uploads}

# Production Logging
logging:
  level:
    com.stolink: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
