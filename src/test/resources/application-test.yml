spring:
  datasource:
    url: jdbc:h2:mem:testdb;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  sql:
    init:
      mode: never

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-id
            client-secret: dummy-secret
  rabbitmq:
    listener:
      simple:
        auto-startup: false

oauth2:
  redirect-uri: http://localhost:3000/oauth2/callback
  allowed-redirect-hosts: localhost

app:
  storage:
    base-path: ./build/test-storage

# Mock or disable external services for tests
toss:
  payments:
    secret-key: test_sk_dummy
    client-key: test_ck_dummy
    webhook-secret: dummy_webhook_secret
    test-mode: true

jwt:
  secret: this-is-a-very-secure-secret-key-for-testing-purposes-only-32chars
  access-token-expiry: 3600000
  refresh-token-expiry: 86400000
