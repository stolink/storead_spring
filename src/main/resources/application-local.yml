# Local Development Profile
spring:
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/stolink
    username: stolink
    password: stolink123
    driver-class-name: org.postgresql.Driver

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

# JWT Configuration (same secret as stolink_spring for shared auth)
jwt:
  secret: ${JWT_SECRET:very-long-and-secure-random-secret-key-that-is-at-least-512-bits-for-hs512-algorithm-security-must-be-kept-secret}
  access-token-expiry: 1800000 # 30분 (ms)
  refresh-token-expiry: 604800000 # 7일 (ms)

# OAuth2 Redirect URI
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5174/oauth2/callback}

# Application Configuration
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:5174
  storage:
    base-path: ./storage/uploads

# Server Configuration (Override for Local)
server:
  port: 8081
