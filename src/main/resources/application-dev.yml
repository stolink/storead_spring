# Development Profile - Uses environment variables from GitHub Secrets
spring:
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_URL}:${POSTGRESQL_PORT:5432}/storead
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Development JPA settings
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
  storage:
    base-path: ${APP_STORAGE_BASE_PATH:/app/storage/uploads}

# Development Logging
logging:
  level:
    com.stolink: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
