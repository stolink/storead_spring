# Production Profile - Uses environment variables from GitHub Secrets
spring:
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_URL}:${POSTGRESQL_PORT:5432}/stolink
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Production JPA settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Google OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000 # 30분 (ms)
  refresh-token-expiry: 604800000 # 7일 (ms)
  cookie-domain: ${JWT_COOKIE_DOMAIN}
  cookie-secure: true # HTTPS 환경

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    base-path: ${APP_STORAGE_BASE_PATH:/app/storage/uploads}

# OAuth2 Configuration
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI}

# Production Logging
logging:
  level:
    com.stolink: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
