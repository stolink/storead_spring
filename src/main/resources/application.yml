server:
  servlet:
    context-path: /storead

spring:
  application:
    name: storead-backend

  profiles:
    active: local

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Multipart file upload
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Actuator Configuration (for Docker healthcheck)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.stolink: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# Toss Payments Configuration
toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
    client-key: ${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
    webhook-secret: ${TOSS_WEBHOOK_SECRET:webhook_secret_key}
