# =============================================================================
# storead_spring - Standalone Docker Compose
# =============================================================================
# 독립 실행 모드: PostgreSQL을 자체적으로 포함
# stolink_spring과 별도로 실행 가능
#
# 실행:
#   docker-compose -f docker-compose.standalone.yml up --build -d
# 중단:
#   docker-compose -f docker-compose.standalone.yml down
# =============================================================================

services:
  # Spring Boot Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-storead-backend:latest}
    container_name: storead-backend
    env_file:
      - .env
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # PostgreSQL
      POSTGRESQL_URL: ${POSTGRESQL_URL:-postgres}
      POSTGRESQL_PORT: ${POSTGRESQL_PORT:-5432}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-stolink}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-stolink123}
      # OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Storage path
      APP_STORAGE_BASE_PATH: /app/storage/uploads
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
    ports:
      - "8081:8080"
    volumes:
      - backend_storage:/app/storage/uploads
    networks:
      - storead-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:16.11-alpine
    container_name: storead-postgres
    environment:
      POSTGRES_DB: stolink
      POSTGRES_USER: ${POSTGRESQL_USERNAME:-stolink}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-stolink123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - storead-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stolink -d stolink"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_storage:
  postgres_data:

networks:
  storead-network:
    driver: bridge
