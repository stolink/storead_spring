# =============================================================================
# storead_spring - Standalone Docker Compose
# =============================================================================
# 독립 실행 모드: PostgreSQL을 자체적으로 포함
# stolink_spring과 별도로 실행 가능
#
# 실행:
#   docker-compose -f docker-compose.standalone.yml up --build -d
# 중단:
#   docker-compose -f docker-compose.standalone.yml down
# =============================================================================

services:
  # Spring Boot Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-storead-backend:latest}
    container_name: storead-backend
    env_file:
      - .env
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # PostgreSQL (External)
      SPRING_DATASOURCE_URL: jdbc:postgresql://stolink-postgres:5432/stolink
      SPRING_DATASOURCE_USERNAME: stolink
      SPRING_DATASOURCE_PASSWORD: stolink123
      # Neo4j (External)
      SPRING_NEO4J_URI: bolt://stolink-neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: stolink123
      # OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Storage path
      APP_STORAGE_BASE_PATH: /app/storage/uploads
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
    ports:
      - "8081:8081"
    volumes:
      - backend_storage:/app/storage/uploads
    networks:
      - stolink-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend_storage:

networks:
  stolink-network:
    external: true
    name: stolink_fastapi_agent_stolink-network
